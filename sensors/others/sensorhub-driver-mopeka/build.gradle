description = 'Mopeka Propane Tank Sensor Driver'
ext.details = 'Driver for Mopeka Pro Check propane tank level sensor via local MQTT bridge (BLE collector)'
version = '0.1.0'

dependencies {
  implementation 'org.sensorhub:sensorhub-core:' + oshCoreVersion
  implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
  // gson comes transitively from sensorhub-core (api dependency of swe-common-core)
}

osgi {
  manifest {
    attributes('Bundle-Vendor': 'Drew / GeoRobotix')
    attributes('Bundle-Activator': 'org.sensorhub.impl.sensor.mopeka.Activator')
  }
}
